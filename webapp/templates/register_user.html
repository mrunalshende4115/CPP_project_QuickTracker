<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickTrack Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f3e5f5, #e0f7fa);
      font-family: 'Segoe UI', sans-serif;
    }
    .register-card {
      max-width: 450px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      background-color: #fff;
    }
    .register-card h3 {
      text-align: center;
      margin-bottom: 25px;
      color: #00796b;
    }
    .form-control:focus {
      border-color: #00796b;
      box-shadow: 0 0 0 0.2rem rgba(0,121,107,.25);
    }
    .btn-register {
      background-color: #00796b;
      color: #fff;
    }
    .btn-register:hover {
      background-color: #004d40;
    }
    .text-link {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <h3>Create Your QuickTrack Account</h3>
    <form method="POST" action="/register_user">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      <div class="mb-3">
        <label for="warehouse_id" class="form-label">Warehouse ID</label>
        <input type="text" name="warehouse_id" id="warehouse_id" class="form-control" placeholder="Enter warehouse ID" required>
      </div>
      <button type="submit" class="btn btn-register w-100">Register</button>
      <div class="text-link">
        <a href="/login">Already have an account? Login</a>
      </div>
    </form>
  </div>

</body>
</html>
